<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Couleurs du logo (modifiables depuis le mode modification) */
  --green:#43984D; --blue:#3470B5; --teal:#4FB0BA; --navy:#14335E;
  --bg:#F3F9FA; --fade:#FFFFFF;
  --muted:#5b6b7a; --line:rgba(20,51,94,.10);
  --glass:linear-gradient(135deg,rgba(255,255,255,.78),rgba(255,255,255,.38));
  --shadow:0 12px 34px rgba(20,51,94,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px;-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--navy);background:var(--bg);line-height:1.65;overflow-x:hidden}
/* Reflets colorés derrière le verre */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(620px 420px at 6% 8%,color-mix(in srgb,var(--teal) 26%,transparent),transparent 70%),
   radial-gradient(560px 520px at 96% 38%,color-mix(in srgb,var(--blue) 18%,transparent),transparent 70%),
   radial-gradient(560px 420px at 14% 96%,color-mix(in srgb,var(--green) 18%,transparent),transparent 70%)}
a{color:inherit}
img{max-width:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Verre liquide arrondi ===== */
.glass{position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -10px 22px color-mix(in srgb,var(--teal) 14%,transparent),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 80% at 10% 0%,rgba(255,255,255,.8),transparent 46%);opacity:.65}
.glass>*{position:relative}

/* ===== Barre du haut ===== */
.topbar{font-size:14px;position:relative;z-index:31}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:6px;padding-bottom:6px;min-height:44px}
.soc{display:flex;gap:6px}
.soc a{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--teal);text-decoration:none;font-weight:800;font-size:15px;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
.soc a:hover{background:#fff}
.topbar .quick{display:flex;gap:8px}
.topbar .quick a{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--teal);text-decoration:none;font-weight:700;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}

/* ===== En-tête flottant en verre ===== */
.hbar{position:sticky;top:10px;height:0;z-index:30}
header.main{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 24px));border-radius:999px}
header.main .hin{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 18px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;margin-right:auto;min-width:0}
.logo img{height:50px;width:auto;display:block;flex:none}
.logo span{font-size:18px;line-height:1.12;color:var(--navy);max-width:200px;font-family:'Poppins','Nunito',sans-serif;font-weight:700}
nav.desk{display:flex;gap:2px}
nav.desk a{text-decoration:none;white-space:nowrap;font-weight:700;padding:9px 12px;border-radius:999px;font-size:15px;transition:.2s}
nav.desk a:hover{background:rgba(255,255,255,.8);color:var(--blue)}

/* Recherche : trait bleu + bouton rond, à côté des 3 traits */
.hsearch{display:flex;align-items:center;gap:8px;flex:0 1 220px;min-width:0}
.hsearch input{flex:1;min-width:0;border:0;border-bottom:2.5px solid var(--blue);background:transparent;padding:8px 6px;font:inherit;font-size:16px;color:var(--navy);outline:0;border-radius:0}
.hsearch input::placeholder{color:#7b8a98}
.hsearch input::-webkit-search-cancel-button{display:none}
.sbtn,.iconbtn{border:0;border-radius:50%;width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;position:relative;padding:0;
  background:linear-gradient(145deg,color-mix(in srgb,var(--blue) 80%,#fff),var(--blue));
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -6px 10px rgba(0,0,0,.14),0 6px 16px color-mix(in srgb,var(--blue) 40%,transparent);transition:transform .2s}
.sbtn:hover,.iconbtn:hover{transform:translateY(-2px)}
.iconbtn.burger{background:var(--glass);color:var(--navy);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1.5px 1px #fff,0 6px 16px rgba(20,51,94,.12);display:none}
.iconbtn.cart{background:linear-gradient(145deg,var(--teal),color-mix(in srgb,var(--teal) 70%,var(--blue)))}
.count{position:absolute;top:-4px;right:-4px;background:var(--green);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;padding:0 5px;border:2px solid #fff}

/* ===== Menu latéral et panier (feuilles en verre) ===== */
.overlay{position:fixed;inset:0;background:rgba(20,51,94,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.side,.drawer{position:fixed;top:10px;right:10px;bottom:10px;border-radius:32px;transform:translateX(115%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s;display:flex;flex-direction:column;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid #fff;box-shadow:inset 0 1.5px 1px #fff,-12px 0 50px rgba(20,51,94,.22)}
.side{width:min(320px,86%);z-index:50;padding:18px 24px 24px}
.drawer{width:min(430px,calc(100% - 20px));z-index:60}
.side.open,.drawer.open{transform:none;visibility:visible}
.side .x,.close{align-self:flex-end;border:0;width:44px;height:44px;border-radius:50%;font-size:26px;color:var(--navy);line-height:1;background:rgba(20,51,94,.07)}
.side a{display:block;text-decoration:none;font-size:19px;font-weight:700;padding:14px 18px;border-radius:999px;margin-top:6px}
.side a:hover{background:rgba(79,176,186,.16);color:var(--blue)}

/* ===== Accueil : carrousel ===== */
.hero{position:relative;overflow:hidden;height:clamp(480px,76vh,660px);background:var(--fade);
  border-radius:0 0 min(44vw,540px) 0/0 0 min(9vw,90px) 0}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;background:var(--fade)}
.slide.on{opacity:1;visibility:visible;z-index:2}
.slide .img{position:absolute;top:0;right:0;bottom:0;width:74%;background:var(--img) center/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 52%);mask-image:linear-gradient(90deg,transparent 0,#000 52%);
  transform:scale(1.07);transition:transform 8s ease-out}
.slide.on .img{transform:scale(1)}
.slide.noimg .img{background:linear-gradient(135deg,var(--teal),var(--blue))}
.slide .wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;padding-top:104px;padding-bottom:64px}
.stext{max-width:520px}
.slide h1{margin:0;font-family:'Poppins','Nunito',sans-serif;font-size:clamp(30px,5vw,56px);line-height:1.12;font-weight:800;color:var(--navy)}
.slide h1 em{font-style:normal;background:linear-gradient(90deg,color-mix(in srgb,var(--teal) 50%,var(--blue)),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.slide .sp{font-size:clamp(16px,2vw,21px);margin:16px 0 0;max-width:520px}
.slide.on .stext>*{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.slide.on .stext>*:nth-child(2){animation-delay:.12s}
.slide.on .stext>*:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:16px;padding:12px 30px;border-radius:999px;border:0;min-height:50px;
  background:linear-gradient(135deg,var(--teal),color-mix(in srgb,var(--teal) 55%,var(--blue)));
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.65),inset 0 -7px 14px rgba(0,0,0,.12),0 10px 24px color-mix(in srgb,var(--teal) 45%,transparent);transition:transform .2s,filter .2s}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90% 90% at 25% 0%,rgba(255,255,255,.55),transparent 55%)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.btn.green{background:linear-gradient(135deg,color-mix(in srgb,var(--green) 80%,#fff),var(--green));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.65),inset 0 -7px 14px rgba(0,0,0,.14),0 10px 24px color-mix(in srgb,var(--green) 45%,transparent)}

.arrow{position:absolute;top:56%;transform:translateY(-50%);z-index:5;width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.9);color:var(--navy);display:flex;align-items:center;justify-content:center;padding:0;
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1.5px 1px #fff,0 8px 22px rgba(20,51,94,.16);transition:.2s}
.arrow:hover{background:#fff;transform:translateY(-50%) scale(1.06)}
.arrow.l{left:18px}.arrow.r{right:18px}
.dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;padding:9px 12px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 1px #fff,0 6px 18px rgba(20,51,94,.14)}
.dots button{width:10px;height:10px;border-radius:999px;border:0;background:color-mix(in srgb,var(--navy) 25%,transparent);padding:0;transition:.3s}
.dots button.on{width:28px;background:linear-gradient(90deg,var(--teal),var(--blue))}

/* ===== Sections ===== */
section{padding:76px 0;position:relative}
.sech{text-align:center;margin-bottom:42px}
.sech h2{margin:0;font-family:'Poppins','Nunito',sans-serif;font-size:clamp(26px,4.2vw,42px);font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--teal)}
.sech h2::after{content:"";display:block;width:76px;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue));margin:16px auto 0}
.sech p{margin:14px auto 0;max-width:620px;color:var(--muted)}

/* À propos : forme organique */
.waves{position:absolute;left:0;top:30px;width:min(46vw,520px);color:var(--teal);opacity:.4;pointer-events:none}
.about{display:flex;flex-wrap:wrap;gap:48px;align-items:center;position:relative}
.blobwrap{position:relative;flex:1 1 340px;max-width:520px;margin:0 auto;aspect-ratio:1/1}
.blobwrap::before{content:"";position:absolute;inset:-4% -6% 4% 4%;border:7px solid color-mix(in srgb,var(--teal) 55%,transparent);border-radius:40% 60% 38% 62%/58% 38% 62% 42%;transform:rotate(14deg)}
.pic{position:absolute;inset:0;border-radius:62% 38% 56% 44%/44% 56% 44% 56%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff,color-mix(in srgb,var(--teal) 14%,#fff)) center/cover no-repeat;border:1px solid #fff;box-shadow:inset 0 2px 2px #fff,0 22px 50px rgba(20,51,94,.16)}
.pic img{width:70%;max-height:75%;object-fit:contain}
.pic.has img{display:none}
.about .txt{flex:1 1 380px;padding:30px 32px;border-radius:36px}
.about .txt h3{margin:0 0 14px;font-family:'Poppins','Nunito',sans-serif;font-size:clamp(22px,3vw,30px);line-height:1.2;color:var(--blue)}
.about .txt p{margin:0 0 24px;white-space:pre-line;font-size:17px}

/* Gamme */
.filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
.chip{border:1px solid rgba(255,255,255,.9);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--navy);padding:9px 20px;border-radius:999px;font-weight:700;font-size:14px;min-height:42px;box-shadow:inset 0 1px 1px #fff,0 4px 12px rgba(20,51,94,.08);transition:.2s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:linear-gradient(135deg,var(--teal),var(--blue));border-color:transparent;color:#fff;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),0 8px 18px color-mix(in srgb,var(--teal) 40%,transparent)}
.results{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px;min-height:24px}
.results .chip{min-height:32px;padding:4px 14px;margin-left:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{border-radius:30px;overflow:hidden;display:flex;flex-direction:column;padding:10px;transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.card .ph{height:180px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 18%,#fff),color-mix(in srgb,var(--blue) 14%,#fff));display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .body{padding:14px 10px 8px;display:flex;flex-direction:column;gap:7px;flex:1}
.card .cl{align-self:flex-start;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,#fff);padding:2px 12px;border-radius:99px}
.card h3{margin:0;font-size:18px;line-height:1.3}
.card .desc{font-size:14px;color:var(--muted);margin:0}
.price{font-weight:800;font-size:21px;color:var(--green);margin-top:auto;padding-top:6px}
.add{border:0;color:#fff;font-weight:800;padding:12px;border-radius:999px;min-height:48px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 75%,#fff),var(--blue));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -6px 12px rgba(0,0,0,.14),0 8px 18px color-mix(in srgb,var(--blue) 35%,transparent);transition:.2s}
.add:hover{transform:translateY(-2px)}
.add[disabled]{background:#a9b8c6;box-shadow:none;cursor:not-allowed;transform:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.acts .add,.dbtn{font-size:14px;padding:12px 8px;min-height:48px;font-family:inherit}
.dbtn{font-weight:800;border-radius:999px;color:var(--blue);cursor:pointer;background:rgba(255,255,255,.78);border:1.5px solid color-mix(in srgb,var(--blue) 38%,transparent);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.9),0 6px 16px rgba(20,51,94,.08);transition:.2s}
.dbtn:hover{transform:translateY(-2px);background:#fff}
.add{cursor:pointer;font-family:inherit}
/* Fiche produit (bouton Description) */
.pm-ov{position:fixed;inset:0;z-index:120;background:rgba(20,51,94,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px;animation:pmin .2s ease}
@keyframes pmin{from{opacity:0}to{opacity:1}}
.pm{position:relative;width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:38px;padding:22px 22px 20px;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(240,250,251,.92));animation:pmup .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pmup{from{transform:translateY(30px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.pm-x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(20,51,94,.12);background:#fff;color:var(--navy);font-size:18px;font-weight:800;cursor:pointer;z-index:2}
.pm-top{display:flex;gap:18px;align-items:center;padding-right:44px;margin-bottom:14px}
.pm-ph{flex:none;width:130px;height:130px;border-radius:32px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 18%,#fff),color-mix(in srgb,var(--blue) 14%,#fff))}
.pm-ph img{width:100%;height:100%;object-fit:cover}
.pm-top h3{margin:6px 0 2px;font-size:24px;line-height:1.2}
.pm-top .price{margin:0;padding:0}
.pm-s{background:rgba(255,255,255,.8);border:1px solid rgba(20,51,94,.08);border-radius:24px;padding:14px 18px;margin-top:10px}
.pm-s h4{margin:0 0 4px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--teal)}
.pm-s p{margin:0;font-size:15px;line-height:1.55;color:var(--navy)}
.pm-note{margin:14px 6px 0;font-size:12.5px;color:var(--muted);font-style:italic}
.pm-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:sticky;bottom:0}
@media (max-width:480px){.pm-top{flex-direction:column;align-items:flex-start}.pm-ph{width:100%;height:170px}}
.empty{grid-column:1/-1;border:2px dashed color-mix(in srgb,var(--teal) 45%,transparent);border-radius:30px;padding:40px;text-align:center;color:var(--muted);background:rgba(255,255,255,.5)}
.empty .btn{margin-top:16px}

/* Contact */
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
.panel{padding:30px;border-radius:34px}
.panel h3{margin:0 0 18px;font-weight:800;font-size:22px}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
input.f,textarea.f{width:100%;border:1px solid rgba(20,51,94,.14);border-radius:20px;padding:13px 18px;font:inherit;color:var(--navy);background:rgba(255,255,255,.75);box-shadow:inset 0 2px 5px rgba(20,51,94,.06)}
input.f:focus,textarea.f:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 25%,transparent)}
textarea.f{min-height:150px;resize:vertical}
.panel .btn{margin-top:20px}
.ci b{display:block;font-size:14px;margin-top:14px}
.ci a{color:var(--blue);text-decoration:none;font-weight:700}
.formmsg{margin-top:14px;font-weight:700;color:var(--green)}

/* Témoignages */
.testi{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.t{border-radius:32px;padding:28px}
.t::after{content:"“";position:absolute;top:2px;right:22px;font-size:80px;color:var(--teal);opacity:.35;line-height:1;font-family:Georgia,serif}
.t p{margin:0 0 18px;font-style:italic}
.who{display:flex;align-items:center;gap:12px}
.who img,.who .av{width:50px;height:50px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #fff}
.who small{display:block;color:var(--muted)}

/* Pied de page */
footer.pg{margin-top:20px;padding:60px 0 26px;border-radius:56px 56px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 16%,#fff),color-mix(in srgb,var(--teal) 30%,#fff));border-top:1px solid #fff;box-shadow:inset 0 2px 2px #fff}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:36px}
footer.pg h4{margin:0 0 16px;color:var(--blue);font-weight:800;font-size:22px;font-family:'Poppins','Nunito',sans-serif}
footer.pg p{margin:0 0 16px;color:var(--navy)}
footer.pg a{text-decoration:none}
footer.pg .links a{display:inline-block;padding:7px 16px;margin:0 6px 8px 0;border-radius:999px;background:rgba(255,255,255,.65);border:1px solid #fff;font-weight:700;font-size:14px}
footer.pg .links a:hover{background:#fff;color:var(--blue)}

.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.dfoot{padding:16px 22px 22px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:12px}
.dfoot .btn{width:100%}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center}

@media (max-width:1100px){

}

        const c = n.style.color, f = n.style.fontSize, w = n.style.fontWeight, i = n.style.fontStyle;
        if(c && OKCOL.test(c)) el.style.color = c;

        if(w && /^(normal|bold|[1-9]00)$/.test(w)) el.style.fontWeight = w;
        if(i === "italic") el.style.fontStyle = "italic";
      }
      walk(n, el); dst.appendChild(el);
    }
  })(t.content, out);
  return out.innerHTML;
}

  .rt-bar{position:fixed;z-index:1200;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:999px;background:rgba(20,51,94,.97);box-shadow:0 12px 36px rgba(0,0,0,.35);max-width:calc(100vw - 16px);overflow-x:auto}
  .rt-bar[hidden]{display:none}

  .rt-bar input[type=color]{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}`;
  document.head.appendChild(s);

function toast(m, err){ const t = document.createElement("div"); t.className = "ed-toast" + (err ? " e" : ""); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function modal(html){
  const ov = document.createElement("div"); ov.className = "ed-ov";
  ov.innerHTML = `<div class="ed-box">${html}</div>`; document.body.appendChild(ov);
  window.__editing_modal = true;
  ov.close = () => { ov.remove(); window.__editing_modal = !!document.querySelector(".ed-ov"); }; return ov;
}

/* ---------- Connexion ---------- */
function login(){
  return new Promise(res => {
    const ov = modal(`<h3>Modifier le site</h3><p style="margin:0;color:#5b6b7a">Entrez votre mot de passe administrateur.</p>
      <form id="lf">${ADMIN ? `<input id="em" type="hidden" value="${esc(ADMIN)}">` : `<label>Email</label><input id="em" type="email" required autocomplete="username">`}<label>Mot de passe</label><input id="pw" type="password" required autocomplete="current-password">
      <div class="ed-row"><button class="ed-b" type="submit">Se connecter</button><button class="ed-b l" type="button" id="no">Annuler</button></div></form>`);
    $("#no", ov).onclick = () => { ov.close(); res(false); };

/* ---------- Champs ---------- */
async function upload(file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await SB.storage.from("media").upload(path, file, { cacheControl:"31536000" });
  if(error) throw error;
  return SB.storage.from("media").getPublicUrl(path).data.publicUrl;
}
function field(f, val, pre){
  const [k, label, type, def] = f, id = pre + k, v = val ?? def ?? "";
  if(type === "textarea") return `<label for="${id}">${label}</label><textarea id="${id}">${esc(v)}</textarea>`;
  if(type === "color") return `<label for="${id}">${label}</label><input type="color" id="${id}" data-k="${k}" value="${/^#[0-9a-f]{6}$/i.test(v) ? esc(v) : def}">`;
  if(type === "number") return `<label for="${id}">${label}</label><input type="number" id="${id}" value="${esc(v)}" step="any">`;
  if(type === "bool") return `<label><input type="checkbox" id="${id}" ${val === false ? "" : "checked"}> ${label}</label>`;
  if(type === "cat"){ const cats = N.data().CATEGORIES.map(c => c.name); return `<label for="${id}">${label}</label><select id="${id}"><option value=""></option>${cats.map(c => `<option ${c === v ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`; }
  if(type === "gallery") return `<label for="${id}">${label}</label><textarea id="${id}" style="min-height:130px" placeholder="https://…">${esc(v)}</textarea>
    <input type="file" accept="image/*" data-upg="${id}" style="margin-top:6px"><small style="color:#5b6b7a">Choisissez une photo pour l'ajouter à la liste. Liste vide = images par défaut.</small>`;
  if(type === "image") return `<label for="${id}">${label}</label>${v ? `<img class="pv" id="${id}_p" src="${esc(v)}" alt="">` : `<img class="pv" id="${id}_p" hidden alt="">`}
    <input type="file" accept="image/*" data-up="${id}"><input type="text" id="${id}" value="${esc(v)}" placeholder="ou collez l'adresse d'une image" style="margin-top:6px">`;
  return `<label for="${id}">${label}</label><input type="text" id="${id}" value="${esc(v)}">`;
}
function read(f, pre, root){
  const [k,, type] = f, el = $("#" + pre + k, root);
  if(type === "bool") return [k, el.checked];
  if(type === "number") return [k, el.value === "" ? null : Number(el.value)];
  return [k, el.value.trim()];
}
function wire(ov){
  ov.addEventListener("change", async e => {
    const gid = e.target.dataset && e.target.dataset.upg;
    if(gid && e.target.files[0]){
      try{ toast("Envoi de la photo…"); const url = await upload(e.target.files[0]);
        const ta = $("#" + gid, ov); ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + url; e.target.value = ""; toast("Photo ajoutée ✔");
      }catch(err){ toast("Échec : " + err.message, true); }
      return;
    }
    const id = e.target.dataset && e.target.dataset.up; if(!id || !e.target.files[0]) return;
    try{
      toast("Envoi de la photo…");
      const url = await upload(e.target.files[0]);
      $("#" + id, ov).value = url; const p = $("#" + id + "_p", ov); p.src = url; p.hidden = false; toast("Photo envoyée ✔");
    }catch(err){ toast("Échec : " + err.message, true); }
  });
  ov.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.k;
    if(k) document.documentElement.style.setProperty("--" + k.replace("color_", ""), e.target.value); });
}

/* ---------- Fenêtres ---------- */
function settingsModal(g){
  const S = N.data().S;
  const ov = modal(`<h3>${g.title}</h3>${g.fields.map(f => field(f, S[f[0]], "s_")).join("")}
    <div class="ed-row"><button class="ed-b g" id="ok">Enregistrer</button><button class="ed-b l" id="cx">Annuler</button></div>`);
  wire(ov);
  $("#cx", ov).onclick = async () => { ov.close(); await N.reload(); refresh(); };
  $("#ok", ov).onclick = async () => {
    const rows = g.fields.map(f => { const [k, v] = read(f, "s_", ov); return { key:k, value:String(v ?? "") }; });
    const { error } = await SB.from("settings").upsert(rows);
    if(error) return toast("Erreur : " + error.message, true);
    ov.close(); await N.reload(); refresh(); toast("Enregistré ✔");
  };
}
function formModal(key, row){
  const L = LISTS[key], isNew = !row || !UUID.test(String(row.id || ""));
  const ov = modal(`<h3>${isNew ? "Ajouter" : "Modifier"} : ${L.title}</h3>${L.fields.map(f => field(f, row ? row[f[0]] : undefined, "f_")).join("")}
    <div class="ed-row"><button class="ed-b g" id="ok">Enregistrer</button><button class="ed-b l" id="cx">Annuler</button>${isNew ? "" : `<button class="ed-b r" id="del">Supprimer</button>`}</div>`);
  wire(ov);
  $("#cx", ov).onclick = () => ov.close();
  $("#ok", ov).onclick = async () => {
    const data = Object.fromEntries(L.fields.map(f => read(f, "f_", ov)));
    const r = isNew ? await SB.from(L.table).insert(data) : await SB.from(L.table).update(data).eq("id", row.id);
    if(r.error) return toast("Erreur : " + r.error.message, true);
    ov.close(); await N.reload(); refresh(); toast("Enregistré ✔");
  };
  if(!isNew) $("#del", ov).onclick = async () => {
    if(!confirm("Supprimer définitivement ?")) return;
    const r = await SB.from(L.table).delete().eq("id", row.id);
    if(r.error) return toast("Erreur : " + r.error.message, true);
    ov.close(); await N.reload(); refresh(); toast("Supprimé");
  };
}
function catsModal(){
  const cats = N.data().CATEGORIES;
  const ov = modal(`<h3>Catégories</h3><div>${cats.map((c, i) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #dce5ea"><span>${esc(c.icon || "")} ${esc(c.name)}</span>${c.id ? `<button class="ed-b l" data-i="${i}">Modifier</button>` : ""}</div>`).join("") || "<p>Aucune.</p>"}</div>

async function messagesModal(){

/* ---------- Édition en place ---------- */
function makeEditable(){
  Object.entries(TEXTS).forEach(([id, key]) => {
    const el = document.getElementById(id); if(!el) return;
    el.contentEditable = "true"; el.dataset.key = key; el.spellcheck = false;
    if(!el.dataset.ed){ el.dataset.ed = "1";
      el.addEventListener("paste", e => { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain")); }); }
  });
  document.querySelectorAll("[data-s]").forEach(el => {
    el.contentEditable = "true"; el.dataset.key = el.dataset.s; el.spellcheck = false;
    if(!el.dataset.ed){ el.dataset.ed = "1";
      el.addEventListener("paste", e => { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain")); }); }
  });
  document.querySelectorAll(".slide h1, .slide .sp").forEach(el => {
    el.contentEditable = "true"; el.spellcheck = false;
    if(!el.dataset.ed){ el.dataset.ed = "1";
      el.addEventListener("paste", e => { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain")); }); }
  });
  const hero = $("#accueil");
  if(hero && !$(".ed-pen", hero)){
    const b = document.createElement("button"); b.className = "ed-pen"; b.textContent = "✎ Photo de cette diapo";
    b.onclick = () => slideModal(); hero.appendChild(b);
  }
  document.querySelectorAll(".card[data-pid]").forEach(c => {
    if($(".ed-pen", c)) return;
    const b = document.createElement("button"); b.className = "ed-pen"; b.textContent = "✎ Modifier";
    b.onclick = e => { e.stopPropagation(); formModal("products", N.data().PRODUCTS.find(p => String(p.id) === c.dataset.pid)); }; c.appendChild(b);
  });
  document.querySelectorAll("#testi .t").forEach((c, i) => {
    if($(".ed-pen", c)) return;
    const b = document.createElement("button"); b.className = "ed-pen"; b.textContent = "✎ Modifier";
    b.onclick = () => formModal("testimonials", N.data().TESTI[i]); c.appendChild(b);
  });
}
function refresh(){ requestAnimationFrame(makeEditable); }

const trimBr = h => h.replace(/(<br\s*\/?>)+$/i, "");
function syncHome(){
  const L = N.data().SLIDES;
  document.querySelectorAll(".slide").forEach((el, i) => { if(!L[i]) return;
    L[i].h = trimBr(clean($("h1", el).innerHTML)); L[i].p = trimBr(clean($(".sp", el).innerHTML)); });
}
const homeStore = () => N.data().SLIDES.map(s => ({ img:s.img, h:s.h, p:s.p }));
async function saveHome(){
  const { error } = await SB.from("settings").upsert([{ key:"home_json", value:JSON.stringify(homeStore()) }]);
  if(error){ toast("Erreur : " + error.message, true); return false; } return true;
}
async function saveTexts(){
  syncHome();
  const rows = {};
  document.querySelectorAll("[data-key]").forEach(el => { rows[el.dataset.key] = trimBr(clean(el.innerHTML)); });
  rows.home_json = JSON.stringify(homeStore());
  const { error } = await SB.from("settings").upsert(Object.entries(rows).map(([key, value]) => ({ key, value })));
  if(error) return toast("Erreur : " + error.message, true);
  await N.reload(true); refresh(); toast("Textes enregistrés ✔");
}
function slideModal(){
  syncHome();
  const L = N.data().SLIDES, i = N.cur(), s = L[i]; if(!s) return;
  const shown = /^def:/.test(s.img) ? "" : s.img;
  const ov = modal(`<h3>Diapo ${i + 1} sur ${L.length}</h3>
    ${field(["img","Photo derrière le texte (large, ex. 1600×700). Vide = photo par défaut","image"], shown, "f_")}
    ${field(["pos","Position de la diapo (1, 2, 3…)","number"], i + 1, "f_")}
    <div class="ed-row"><button class="ed-b g" id="ok">Enregistrer</button><button class="ed-b l" id="cx">Annuler</button>${L.length > 1 ? `<button class="ed-b r" id="del">Supprimer la diapo</button>` : ""}</div>`);
  wire(ov);
  $("#cx", ov).onclick = () => ov.close();
  $("#ok", ov).onclick = async () => {
    s.img = $("#f_img", ov).value.trim() || ("def:" + (i % 3));
    const pos = Math.min(L.length, Math.max(1, parseInt($("#f_pos", ov).value, 10) || i + 1)) - 1;
    if(pos !== i){ L.splice(i, 1); L.splice(pos, 0, s); }
    if(!(await saveHome())) return;
    ov.close(); await N.reload(true); N.go(pos); refresh(); toast("Enregistré ✔");
  };
  const del = $("#del", ov);
  if(del) del.onclick = async () => {
    if(!confirm("Supprimer cette diapo ?")) return;
    L.splice(i, 1);
    if(!(await saveHome())) return;
    ov.close(); await N.reload(true); N.go(Math.min(i, L.length - 1)); refresh(); toast("Supprimée");
  };
}
async function addSlide(){
  syncHome();
  const L = N.data().SLIDES, i = N.cur();
  L.splice(i + 1, 0, { img:"def:" + ((i + 1) % 3), h:"", p:"Nouveau texte : cliquez ici pour écrire." });
  if(!(await saveHome())) return;
  await N.reload(true); N.go(i + 1); refresh(); toast("Diapo ajoutée : modifiez son texte puis enregistrez");
}

/* ---------- Barre « couleur et taille » : apparaît quand on sélectionne du texte ---------- */
function richBar(){
  if($("#rtbar")) return;
  const bar = document.createElement("div"); bar.id = "rtbar"; bar.className = "rt-bar"; bar.hidden = true;
  const sw = ["#14335E","#4FB0BA","#3470B5","#43984D","#c0392b","#e67e22","#000000","#ffffff","#7f8c8d"];
  bar.innerHTML = `<button type="button" data-c="dec" title="Plus petit" aria-label="Diminuer la police">A−</button><button type="button" data-c="inc" title="Plus grand" aria-label="Augmenter la police">A+</button><button type="button" data-c="b" title="Gras"><b>B</b></button>`
    + sw.map(c => `<button type="button" class="sw" data-col="${c}" style="background:${c}" aria-label="Couleur ${c}"></button>`).join("")
    + `<label class="cp" title="Autre couleur">🎨<input type="color" id="rtcol" value="#14335E"></label><button type="button" data-c="x" title="Effacer la mise en forme">✕</button>`;
  document.body.appendChild(bar);
  let saved = null;
  const editable = n => { const el = n && (n.nodeType === 1 ? n : n.parentElement); return el && el.closest("[contenteditable=true]"); };
  function restore(){
    if(!saved) return false; const el = editable(saved.commonAncestorContainer); if(!el) return false;
    el.focus({ preventScroll:true }); const s = getSelection(); s.removeAllRanges(); s.addRange(saved); return true;
  }
  document.addEventListener("selectionchange", () => {
    if(!window.__editing) return;
    const sel = getSelection();
    if(!sel.rangeCount || sel.isCollapsed){ if(!bar.contains(document.activeElement)) bar.hidden = true; return; }
    const r = sel.getRangeAt(0);
    if(!editable(r.commonAncestorContainer)) return;
    saved = r.cloneRange();
    const rect = r.getBoundingClientRect();
    bar.hidden = false;
    bar.style.left = Math.max(8, Math.min(innerWidth - bar.offsetWidth - 8, rect.left + rect.width / 2 - bar.offsetWidth / 2)) + "px";
    bar.style.top = (rect.top > 76 ? rect.top - bar.offsetHeight - 10 : rect.bottom + 10) + "px";
  });
  bar.addEventListener("mousedown", e => { if(e.target.closest("button")) e.preventDefault(); });
  function color(c){ if(!restore()) return; document.execCommand("styleWithCSS", false, true); document.execCommand("foreColor", false, c); }
  function size(dir){
    if(!restore()) return;
    const sel = getSelection(); if(!sel.rangeCount) return;
    const root = editable(sel.anchorNode); if(!root) return;
    const rg = sel.getRangeAt(0); let sn = rg.startContainer;
    if(sn.nodeType === 1 && sn.childNodes[rg.startOffset]) sn = sn.childNodes[rg.startOffset];
    const startEl = sn.nodeType === 1 ? sn : sn.parentElement;
    const cur = parseFloat(getComputedStyle(startEl).fontSize) || 16;
    const target = Math.max(8, Math.min(140, cur * (dir > 0 ? 1.12 : 1 / 1.12)));
    document.execCommand("styleWithCSS", false, false);
    document.execCommand("fontSize", false, "7");
    const made = [];
    root.querySelectorAll('font[size="7"]').forEach(f => {
      const span = document.createElement("span");
      while(f.firstChild) span.appendChild(f.firstChild);
      f.replaceWith(span);
      const pp = parseFloat(getComputedStyle(span.parentElement).fontSize) || 16;
      span.style.fontSize = (target / pp).toFixed(3) + "em"; made.push(span);
    });
    if(made.length){ const r = document.createRange(); r.setStartBefore(made[0]); r.setEndAfter(made[made.length - 1]); sel.removeAllRanges(); sel.addRange(r); }
  }
  bar.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.col) return color(b.dataset.col);
    if(b.dataset.c === "inc") size(1);
    else if(b.dataset.c === "dec") size(-1);
    else if(b.dataset.c === "b"){ if(restore()) document.execCommand("bold"); }
    else if(b.dataset.c === "x"){ if(restore()) document.execCommand("removeFormat"); }
  });
  $("#rtcol", bar).addEventListener("change", e => color(e.target.value));
}

function enable(){
  window.__editing = true; css(); document.body.classList.add("editing");
  document.addEventListener("click", e => { if(window.__editing && e.target.closest("[contenteditable=true]")) e.preventDefault(); }, true);
  document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.key; if(!k) return;
    document.querySelectorAll(`[data-key="${k}"]`).forEach(o => { if(o !== e.target) o.innerHTML = e.target.innerHTML; }); });
  const bar = document.createElement("div"); bar.className = "ed-bar";
  bar.innerHTML = `<button class="ed-b g" id="b-save">💾 Enregistrer les textes</button>
    <button class="ed-b" id="b-look">🎨 Logo et couleurs</button><button class="ed-b" id="b-slider">⏱ Défilement et dégradé</button><button class="ed-b" id="b-menu">☰ Menu et boutons</button>
    <button class="ed-b" id="b-slimg">🖼 Photo de cette diapo</button><button class="ed-b" id="b-slide">＋ Diapo d'accueil</button>
    <button class="ed-b" id="b-sante">🖼 Images « Votre santé »</button>
    <button class="ed-b" id="b-prod">＋ Produit</button>
    <button class="ed-b" id="b-contact">WhatsApp et réseaux</button>
    <button class="ed-b" id="b-msg">✉ Messages</button>
    <button class="ed-b l" id="b-quit">Quitter</button>`;
  document.body.appendChild(bar);
  $("#b-save").onclick = saveTexts;
  $("#b-look").onclick = () => settingsModal(GROUPS.look);
  $("#b-slider").onclick = () => settingsModal(GROUPS.slider);
  $("#b-menu").onclick = () => settingsModal(GROUPS.menu);
  $("#b-contact").onclick = () => settingsModal(GROUPS.contact);
  $("#b-slide").onclick = addSlide;
  $("#b-slimg").onclick = slideModal;
  $("#b-sante").onclick = () => settingsModal(GROUPS.sante);
  $("#b-prod").onclick = () => formModal("products", null);
  $("#b-msg").onclick = messagesModal;
  $("#b-quit").onclick = async () => { await SB.auth.signOut(); history.replaceState(null, "", location.pathname + location.search); location.reload(); };
  new MutationObserver(refresh).observe(document.getElementById("grid"), { childList:true });
  richBar();
  makeEditable();
  toast("Mode modification actif : cliquez sur un texte pour le changer, sélectionnez-le pour sa couleur et sa taille");
}

async function start(nsa){
  if(window.__editing) return;
  N = nsa; SB = N.SB();
  if(!SB){ alert("Supabase n'est pas encore branché : collez l'URL et la clé dans le bloc CONFIGURATION en haut de index.html."); return; }
  css();
  const { data:{ session } } = await SB.auth.getSession();
  if(!session && !(await login())){ history.replaceState(null, "", location.pathname + location.search); return; }
  enable();
}

return { start };
